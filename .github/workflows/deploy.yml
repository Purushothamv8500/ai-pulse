name: Deploy to Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Prevent concurrent production deployments
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── Migrate database ─────────────────────────────────────────────────────
      - name: Run database migrations
        env:
          DATABASE_SYNC_URL: ${{ secrets.DATABASE_SYNC_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          cd backend
          pip install -q -r requirements.txt
          if [ -n "$(ls alembic/versions/ 2>/dev/null)" ]; then
            echo "Running alembic upgrade head..."
            alembic upgrade head
          else
            echo "No migration files found — skipping alembic (init_db will create_all on startup)"
          fi

      # ── Deploy API ───────────────────────────────────────────────────────────
      - name: Deploy API service
        id: deploy_api
        run: |
          echo "Triggering Render API deployment..."
          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_API_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')
          echo "Response: $RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))")
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT

      - name: Wait for API deployment
        run: |
          DEPLOY_ID="${{ steps.deploy_api.outputs.deploy_id }}"
          echo "Waiting for deploy $DEPLOY_ID..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s \
              "https://api.render.com/v1/services/${{ secrets.RENDER_API_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
            echo "  attempt $i: $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "API deployment succeeded"
              break
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "API deployment failed with status: $STATUS"
              exit 1
            fi
            sleep 20
          done

      # ── Verify API health ────────────────────────────────────────────────────
      - name: Verify API health
        run: |
          API_URL="${{ secrets.RENDER_API_URL }}"
          echo "Checking $API_URL/health ..."
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health")
            if [ "$CODE" = "200" ]; then
              echo "Health check passed (HTTP $CODE)"
              break
            fi
            echo "  attempt $i: HTTP $CODE — retrying in 10s"
            sleep 10
          done
          if [ "$CODE" != "200" ]; then
            echo "Health check failed after retries"
            exit 1
          fi

          echo "Checking database health..."
          curl -sf "$API_URL/health/database" | python3 -c "import sys,json; d=json.load(sys.stdin); print('DB:', d['status']); sys.exit(0 if d['status']=='healthy' else 1)"

      # ── Deploy Scheduler ─────────────────────────────────────────────────────
      - name: Deploy Scheduler service
        id: deploy_scheduler
        run: |
          echo "Triggering Render Scheduler deployment..."
          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SCHEDULER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')
          echo "Response: $RESPONSE"

      - name: Wait for Scheduler deployment
        run: |
          echo "Waiting 60s for scheduler container to start..."
          sleep 60
          STATUS=$(curl -s \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SCHEDULER_SERVICE_ID }}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('suspended','unknown'))")
          echo "Scheduler service state: $STATUS"

      # ── Deployment summary ───────────────────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          echo "==========================="
          echo "Deployment: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "==========================="
