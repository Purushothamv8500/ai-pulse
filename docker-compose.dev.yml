services:
  db:
    image: postgres:16-alpine
    container_name: aipulse-db
    environment:
      POSTGRES_USER: aipulse
      POSTGRES_PASSWORD: aipulse
      POSTGRES_DB: aipulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aipulse-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
